# Cloudflare Pages + Workers config for rwha-sim webapp
# Deploy: wrangler pages deploy .svelte-kit/cloudflare --project-name rwha-sim
# Local dev: wrangler pages dev .svelte-kit/cloudflare  (after npm run build)
#   OR: npm run dev  (Vite dev server — faster for UI work, no D1)

name = "rwha-sim"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

[[d1_databases]]
binding     = "DB"
database_name = "rwha-sim"
database_id   = "e0c6f03c-9c6a-4c96-976a-a7befebec224"
