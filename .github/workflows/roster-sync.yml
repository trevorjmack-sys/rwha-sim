name: Nudge rwha.net roster sync

# The site syncs rosters from rwha.net on its own whenever the last sync is
# more than two days old and someone loads a page. This visit every two days
# makes sure that happens even when nobody is using the site.

on:
  schedule:
    - cron: '17 14 */2 * *'   # ~7am Pacific, every other day
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the site
        run: |
          out=$(curl -sS -L -o /dev/null -w '%{http_code} %{url_effective}' https://rwha-sim.trevorjmack.com/)
          echo "Response: $out"
